name: index-market

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-market
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install ethers only
        run: npm install --no-save --no-audit --no-fund ethers@6
      - name: rebuild order book
        run: node scripts/index_market.js
      - name: commit if changed
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.json
          if git diff --quiet --cached; then echo "no change"; else
            git commit -m "index: refresh order book"
            git push
          fi
